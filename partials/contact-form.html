<!-- partials/contact-form.html — the enquiry form. Edit here, then run: node tools/sync-partials.js

     Built no-JS first. This markup is a complete, working HTML form: native
     POST to Web3Forms, native `required` and `type="email"` validation, a
     honeypot, and a CSS-only success note. js/modules/form.js then enhances
     it — sets novalidate, takes over validation with inline messages and an
     aria-live summary, and submits with fetch so the page never reloads.

     The access key and the no-JS redirect are baked from js/site.config.js.
     While the key is a placeholder its hidden input is removed; form.js then
     reports that the form is not connected rather than sending an enquiry
     nowhere. The redirect needs an absolute URL (Web3Forms does not accept a
     relative one), so it waits for SITE.url too. -->

  <div class="contact-form">
    <!-- Shown by :target after a no-JS submission redirects to #sent. -->
    <div class="form-sent" id="sent" tabindex="-1">
      <h2 class="form-sent__title">Thanks — your enquiry has been sent</h2>
      <p>We&rsquo;ll come back to you with a technical response.</p>
    </div>

    <form class="form" action="https://api.web3forms.com/submit" method="POST" data-contact-form
          aria-labelledby="form-title">
      <h2 id="form-title" class="form__title">Send us an enquiry</h2>

      <input type="hidden" name="access_key" value="{{web3formsKey}}" data-requires="web3formsKey">
      <input type="hidden" name="subject" value="New enquiry from the {{name}} website">
      <input type="hidden" name="from_name" value="{{name}} website">
      <input type="hidden" name="redirect" value="{{contactSent}}" data-requires="contactSent">
      <input class="form__hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">

      <!-- Present from first paint and never inserted later, so screen
           readers already know to watch it. form.js writes the error
           summary, the sending state, and the result here. -->
      <div class="form__status" role="status" aria-live="polite" data-form-status></div>

      <p class="form__note">Fields marked <span aria-hidden="true">(required)</span><span class="visually-hidden">required</span> must be filled in.</p>

      <div class="form__grid">
        <div class="field">
          <label class="field__label" for="f-name">Name <span class="field__req" aria-hidden="true">(required)</span></label>
          <input class="field__input" id="f-name" name="name" type="text" autocomplete="name" required>
          <p class="field__error" id="f-name-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="f-company">Company</label>
          <input class="field__input" id="f-company" name="company" type="text" autocomplete="organization">
        </div>

        <div class="field">
          <label class="field__label" for="f-email">Work email <span class="field__req" aria-hidden="true">(required)</span></label>
          <input class="field__input" id="f-email" name="email" type="email" autocomplete="email"
                 inputmode="email" spellcheck="false" required>
          <p class="field__error" id="f-email-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="f-phone">Phone</label>
          <input class="field__input" id="f-phone" name="phone" type="tel" autocomplete="tel">
        </div>

        <div class="field">
          <label class="field__label" for="f-location">Country / city</label>
          <input class="field__input" id="f-location" name="location" type="text" autocomplete="address-level2">
        </div>

        <div class="field">
          <label class="field__label" for="f-interest">Area of interest</label>
          <select class="field__input field__select" id="f-interest" name="interest">
            <option value="">Select one</option>
            <option>Smart water metering</option>
            <option>Smart street lighting</option>
            <option>Water leak detection</option>
            <option>Water quality monitoring</option>
            <option>Water level monitoring</option>
            <option>People &amp; asset tracking</option>
            <option>ATEX zone sensors</option>
            <option>Consultancy &amp; tender preparation</option>
            <option>RF planning &amp; site survey</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field field--full">
          <label class="field__label" for="f-message">Message <span class="field__req" aria-hidden="true">(required)</span></label>
          <textarea class="field__input field__textarea" id="f-message" name="message" rows="6" required></textarea>
          <p class="field__error" id="f-message-error" hidden></p>
        </div>
      </div>

      <p class="form__actions">
        <button class="btn btn--primary" type="submit" data-form-submit>Send your enquiry</button>
      </p>
    </form>
  </div>
