<!-- partials/head.html — the head bits every page shares. Edit here, then run: node tools/sync-partials.js
     Per-page <title> and <meta name="description"> stay in the page itself.
     Canonical, Open Graph and JSON-LD are computed per page into the
     <!-- @generated meta --> region, because they depend on SITE.url. -->
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/brand/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#111B2E">

  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
  <!-- Synchronous on purpose: decides before first paint whether the logo intro
       plays (once per session, never under reduced motion). ~0.5 KB. -->
  <script src="/js/intro-gate.js"></script>

  <!-- The no-JavaScript nav. The drawer is the default layout, so without a
       script to open it the nav would be unreachable; these rules put the
       list back in the flow and remove the control that could not work.
       Parsed only when scripting is off, so it costs enabled browsers
       nothing, and tools/check-nav.js tests this path on every run. -->
  <noscript>
    <style>
      .site-header__toggle { display: none; }
      .site-nav {
        position: static;
        width: auto;
        padding: 0;
        background: none;
        box-shadow: none;
        visibility: visible;
        transform: none;
        overflow: visible;
      }
      .mega {
        position: static;
        display: block;
        opacity: 1;
        visibility: visible;
        min-width: 0;
        padding: 0 0 0 var(--space-12);
        background: none;
        border: 0;
        box-shadow: none;
      }
      .site-nav__disclosure { display: none; }
    </style>
  </noscript>
